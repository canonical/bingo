# concierge-juju4.yaml — environment provisioning for Juju 4 integration tests.
# Bootstraps Canonical Kubernetes (k8s) and Juju 4 for k8s charm deployment.
# Reference: https://github.com/canonical/charm-ci/examples/concierge-k8s.yaml
juju:
  channel: 4.0/edge
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  k8s:
    enable: true
    bootstrap: true
    channel: 1.33-classic/stable
    features:
      # traefik-k8s requests a LoadBalancer Service; without a load-balancer,
      # k8s can't assign it an external IP, so traefik gets stuck in "blocked"
      # ("unable to obtain an IP or hostname from the cluster") and never
      # finishes wiring up ingress routes.
      load-balancer:
        l2-mode: "true"
        cidrs: "10.43.45.0/28"
      local-storage: {}
      network: {}

host:
  packages:
    - skopeo
