# charmcraft.yaml — bingo charm using the go-framework extension.
# See https://documentation.ubuntu.com/charmcraft/stable/reference/files/charmcraft-yaml-file/
name: bingo

type: charm

base: ubuntu@24.04
platforms:
  amd64:

summary: Canonical Pastebin — Go + React replacement for paste.canonical.com
description: |
  bingo is a 12-Factor Go application providing paste creation, retrieval,
  expiry, optional OIDC authentication (Canonical Identity Platform), and a
  React frontend styled with Canonical's Vanilla Framework / Pragma components.
documentation: https://canonical-bingo-charm.readthedocs-hosted.com/

extensions:
  - go-framework

assumes:
  - k8s-api

requires:
  postgresql:
    interface: postgresql_client
    limit: 1
  tracing:
    interface: tracing
    optional: true
    limit: 1
  oauth:
    interface: oauth
    optional: true
    limit: 1

config:
  options:
    base-url:
      type: string
      description: |
        Public base URL for generated paste links, e.g. https://paste.canonical.com.
        Injected as APP_BASE_URL.
      default: ""
    max-paste-size-bytes:
      type: int
      description: Maximum paste content size in bytes. Injected as APP_MAX_PASTE_SIZE_BYTES.
      default: 5242880
    log-level:
      type: string
      description: "Logging level: debug|info|warn|error. Injected as APP_LOG_LEVEL."
      default: info
    web-dir:
      type: string
      description: |
        Path to the built frontend assets served as a SPA. Injected as
        APP_WEB_DIR. Empty disables static file serving.
      default: /app/web/dist
    oauth-redirect-path:
      type: string
      description: |
        Path appended to base-url to build the OIDC callback redirect URI
        registered with the identity provider over the oauth relation. Must
        match the Go app's callback route (/auth/callback).
      default: /auth/callback
    oauth-scopes:
      type: string
      description: |
        Space-separated OAuth scopes requested from the identity provider over
        the oauth relation. Must include 'openid'.
      default: "openid email profile"
    oauth-user-name-attribute:
      type: string
      description: |
        Claim used to identify the authenticated user, from the identity
        provider's userinfo response, over the oauth relation.
      default: sub
