[project]
name = "bingo"
version = "0.0.1"
requires-python = ">=3.12"

# Charm code dependencies. For charm libraries fetched via `charmcraft fetch-libs`,
# inspect each library's PYDEPS list and add those here instead.
dependencies = [
    "ops~=3.7",
    "paas-charm<2.0",
]

[dependency-groups]
lint = [
    "ruff",
    "codespell",
    "mypy",
]
unit = [
    "coverage[toml]",
    "ops[testing]",
    "paas-charm<2.0",
    "pytest",
]
integration = [
    "jubilant>=1.8,<2",
    "pytest",
    "pytest-jubilant>=2.0.1,<3",
    "PyYAML",
    "opcli",
    # Used to create the Tempo test bucket in test_tracing_integration.
    "minio",
]

[tool.uv.sources]
# opcli is published only from the charm-ci git repository, not PyPI.
opcli = { git = "https://github.com/canonical/charm-ci.git", tag = "v1.0.0" }

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
testpaths = ["tests/integration"]
# Turn warnings into errors so deprecations and resource leaks fail the unit
# suite rather than accumulating unnoticed. Each ignore below is anchored to a
# specific message and is for third-party code; the charm's own code raises
# none. The integration env opts out (see tox.ini) because any warnings there
# come from the deployment tooling and are not this charm's to fix.
filterwarnings = [
    "error",
    # Raised by the vendored loki_k8s charm lib and by paas_charm; the fixes
    # belong upstream in canonical/loki-k8s-operator and canonical/paas-charm.
    "ignore:JujuVersion.from_environ\\(\\) is deprecated:DeprecationWarning",
    # paas_charm.charm_state calls pydantic's deprecated BaseModel.dict();
    # the fix belongs upstream in canonical/paas-charm.
    "ignore:The `dict` method is deprecated; use `model_dump` instead:DeprecationWarning",
]

[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104"]}
extend-exclude = ["__pycache__", "*.egg_info"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = ["paas_charm.*", "charms.*"]
ignore_missing_imports = true
