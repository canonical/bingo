# publish_charms.yml — Publish to CharmHub.
# Delegates to charm-ci publish-artifacts.yml which calls opcli to upload
# the built rock and charm to their respective registries.
# Reference: https://github.com/canonical/charm-ci/.github/workflows/publish-artifacts.yml
#
# Runs automatically on every push to main, publishing to the unstable
# (1/edge) channel configured per-charm in artifacts.yaml. Can also be
# triggered manually to publish to a different channel (e.g. 1/stable).
name: Publish Charms

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: "CharmHub channel (e.g. 1/edge, 1/stable)"
        required: false
        type: string
      dry-run:
        description: "Validate artifacts without uploading"
        type: boolean
        default: false

jobs:
  publish:
    name: Publish to CharmHub
    uses: canonical/charm-ci/.github/workflows/publish-artifacts.yml@0eef5b8cbef3ee74907850f790cab64bcf0499e5 # v1.0.0
    with:
      channel: ${{ inputs.channel }}
      dry-run: ${{ inputs.dry-run }}
      integration-workflow-name: charms_integration.yaml
    permissions:
      contents: write
      actions: read
    secrets: inherit
